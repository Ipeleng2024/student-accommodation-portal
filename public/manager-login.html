<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manager login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="brand"><a href="/">Your Residence Name</a></div>
    <nav class="site-nav">
      <a href="/">Public listings</a>
    </nav>
  </header>

  <main style="max-width:420px;">
    <span class="eyebrow">Manager access</span>
    <h2 style="font-family:var(--font-display); font-size:28px; margin-top:8px;">Sign in</h2>

    <form id="login-form" style="margin-top:24px; display:flex; flex-direction:column; gap:14px;">
      <label style="font-size:13px; color:var(--ink-soft);">
        Email
        <input type="email" id="email" required
          style="width:100%; margin-top:6px; padding:10px 12px; border:1px solid var(--line); border-radius:4px; font-family:var(--font-body); font-size:14px; background:var(--paper);" />
      </label>
      <label style="font-size:13px; color:var(--ink-soft);">
        Password
        <input type="password" id="password" required
          style="width:100%; margin-top:6px; padding:10px 12px; border:1px solid var(--line); border-radius:4px; font-family:var(--font-body); font-size:14px; background:var(--paper);" />
      </label>

      <button type="submit"
        style="margin-top:8px; padding:11px; border:none; border-radius:4px; background:var(--ink); color:var(--paper); font-family:var(--font-body); font-size:14px; font-weight:600; cursor:pointer;">
        Sign in
      </button>

      <p id="error-msg" style="color:var(--rust); font-size:13px; display:none;"></p>
    </form>
  </main>

  <script src="/js/manager-login.js"></script>
</body>
</html>
